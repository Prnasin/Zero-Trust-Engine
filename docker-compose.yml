version: "3.9"

services:
  mongo:
    image: mongo
    container_name: zero-trust-mongo
    restart: always

    ports:
      - "27019:27017"

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: zero-trust-redis
    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
